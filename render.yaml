services:
  - type: web
    name: secure-auth
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: secure-auth-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.3

databases:
  - name: secure-auth-db
    plan: free
    databaseName: secure_auth
    ipAllowList: []
